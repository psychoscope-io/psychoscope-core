version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # x/ansi e atualizado junto com o Bubble Tea: o cellbuf fixado pelo bubbletea v1 nao compila
      # com x/ansi >= 0.11 (PR #1 quebrou o build). Reavaliar ao migrar o Bubble Tea.
      - dependency-name: "github.com/charmbracelet/x/ansi"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
